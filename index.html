const PM_WARNING=100;
function pmState(e,h){const rec=db.services.filter(s=>s.eq===e.id&&s.interval===h).sort((a,b)=>b.hours-a.hours)[0];const baseline=rec?.hours??(h===300?e.last300:null);if(baseline==null||e.hours==null)return {known:false};const elapsed=Number(e.hours)-Number(baseline),remaining=h-elapsed;return {known:true,baseline,elapsed,remaining,pct:Math.max(0,Math.min(100,elapsed/h*100)),status:remaining<=0?'DUE':remaining<=PM_WARNING?'COMING UP':'GOOD',color:remaining<=0?'#d55d55':remaining<=PM_WARNING?'#e6ad42':'#4aaf83'};}
function pmVisual(e,t){const p=pmState(e,t.h);const manualDue=t.h===1000&&(/(?:^|\D)36(?:\D|$)/.test(String(e.fleetNo||'')))&&/1000.hour.*(?:due|outstanding)|(?:due|outstanding).*1000.hour/i.test(e.notes||'');if(!p.known)return `<div class="pmrow"><b>${t.h.toLocaleString()}-hour PM</b> <span class="pmstatus warn">${manualDue?'REPORTED DUE':'BASELINE NEEDED'}</span><p class="tiny muted">${manualDue?'Outstanding per shop note. ':''}Enter the last completed ${t.h.toLocaleString()}-hour PM meter reading to calculate progress.</p>${btn('Open checklist',`openPM(${JSON.stringify(e.id)},${t.h})`,'secondary')}</div>`;const status=manualDue?'REPORTED DUE':p.status;const color=manualDue?'#d55d55':p.color;return `<div class="pmrow"><div class="flex"><b>${t.h.toLocaleString()}-hour PM</b><span class="pmstatus" style="color:${color}">${status}</span></div><div class="pmbar"><div class="pmfill" style="width:${p.pct}%;background:${color}"></div></div><small>Last: ${Number(p.baseline).toLocaleString()} hrs • ${p.remaining<=0?Math.abs(p.remaining)+' hrs overdue':p.remaining+' hrs remaining'}</small>${p.remaining<=PM_WARNING&&p.remaining>0?'<p class="warn tiny">Within 100 hours — consider combining this service while in the shop.</p>':''}${btn('Open checklist',`openPM(${JSON.stringify(e.id)},${t.h})`,'secondary')}</div>`;}
function showMachine(e){const templates=pmTemplates[e.type]||[];const records=db.repairs.filter(r=>r.eq===e.id).slice().reverse();const services=db.services.filter(s=>s.eq===e.id).slice().reverse();$('equipment').innerHTML=`<div class="flex">${btn('← Equipment',"selected=null;renderEquipment()",'secondary')}${btn('✎ Edit',`editEquipment(${JSON.stringify(e.id)})`,'secondary')}</div><h2>${esc(e.name)} <span class="pill">${esc(e.id)}</span></h2><div class="card">${e.photo?`<img class="thumb" src="${e.photo}">`:'<p class="muted">No equipment photo yet. Tap Edit to add one.</p>'}<p>${esc(e.make)} ${esc(e.model)} ${e.year?'('+esc(e.year)+')':''} • ${area(e)} • <b>${esc(e.status||'Active')}</b></p><p class="tiny">Unit: ${esc(e.fleetNo||'—')} • CFP: ${esc(e.cfpNo||'—')}<br>GEM tablet: ${esc(e.gemId||'—')}<br>Serial: ${esc(e.serial||'—')}</p>${e.pmDue300!=null?`<p class="warn"><b>Confirmed next PM due:</b> 300h at ${e.pmDue300} • 1000h at ${e.pmDue1000} • 2000h at ${e.pmDue2000}. Verify current meter before scheduling.</p>`:''}<p><b>Last 300-hour PM:</b> ${e.last300==null?'Not entered':e.last300+' hrs'}<br><b>Next 300-hour PM:</b> ${e.last300==null?'Unknown':(e.last300+300)+' hrs'}<br><b>Hours remaining:</b> ${e.last300==null||e.hours==null?'Unknown':(e.last300+300-e.hours)+' hrs'}</p><p class="muted tiny">${esc(e.notes||'No equipment notes')}<br>${esc(e.source||'')}</p><div class="card" style="background:#102333"><b>${e.type==='Forklift'?'Forklift total-meter hour limit':'Annual operating-hour allowance'}</b><p>${e.hours!=null&&(e.type==='Forklift'||e.yearStart)?`${used(e).toLocaleString()} of ${limit(e).toLocaleString()} hours used • ${(limit(e)-used(e)).toLocaleString()} hours remaining`:'Meter baseline not set — enter it in Edit to calculate usage.'}</p><small>Allowance: ${limit(e).toLocaleString()} ${e.type==='Forklift'?'total meter hours':'hours/year'} ${e.annualLimit?'(machine-specific)':'(shop default)'}</small></div><div class="grid"><div><small>Total meter</small><h2>${e.hours==null?'—':Number(e.hours).toLocaleString()}</h2></div><div><small>${e.type==='Forklift'?'Hours toward limit':'Annual hours'}</small><h2>${e.hours!=null&&(e.type==='Forklift'||e.yearStart)?used(e).toLocaleString():'Not set'}</h2></div></div>${btn('Update meter',`updateMeter(${JSON.stringify(e.id)})`,'secondary')} ${btn('Equipment QR',`showQR(${JSON.stringify(e.id)})`,'secondary')}</div><div class="card"><h3>PM progress • 100-hour early warning</h3><p class="tiny muted">Green = good, yellow = within 100 hours, red = due. Each service uses its own last-completed baseline. Confirm against MAPCON.</p>${templates.length?templates.map(t=>pmVisual(e,t)).join(''):'No PM template yet for this equipment type.'}</div><div class="card"><h3>Repair history (${records.length})</h3>${btn('🎙️ New repair note',`newRepair(${JSON.stringify(e.id)})`)}${input('repairSearch','Search previous repairs','') }<div id="repairList"></div></div><div class="card"><h3>Recent completed services</h3>${services.map(s=>`<div class="row"><b>${s.interval}-hour PM</b> • ${esc(s.date)}<br><small>${s.hours} hrs • ${esc(s.notes||'')}</small></div>`).join('')||'<small>No services recorded yet.</small>'}</div>`;window.currentRepairEq=e.id;filterRepairs() ;$('repairSearch').addEventListener('input',filterRepairs)}

function filterRepairs(){const el=$('repairList');if(!el)return;let q=($('repairSearch')?.value||'').toLowerCase();el.innerHTML=db.repairs.filter(r=>r.eq===window.currentRepairEq&&(r.note+' '+r.issue).toLowerCase().includes(q)).slice().reverse().map(r=>`<div class="row"><b>${esc(r.issue||'Repair')}</b><br><small>${esc(r.date)} • ${r.hours} hrs</small><p>${esc(r.note)}</p><small>Priority ${esc(r.priority||'—')} • Status: ${esc(r.status||'Completed / historical')}</small> ${r.status&&r.status!=='Completed'?btn('Mark completed',`completeRepair(${db.repairs.indexOf(r)})`,'secondary'):''}${r.photo?`<img class="thumb" src="${r.photo}">`:''}${r.eq==='4-012-0047'&&/bent carriage/i.test(r.issue||'')?`<div class="grid">${carriage47Photos.map((src,i)=>`<a href="${src}" target="_blank" title="View carriage photo ${i+1}"><img class="thumb" src="${src}" alt="Forklift 47 carriage damage photo ${i+1}"></a>`).join('')}</div><small>Two inspection photos embedded in this ShopTrack version. They are not automatically attached to email.</small>`:''}</div>`).join('')||'<p class="muted">No matching repairs.</p>'}
function completeRepair(i){let r=db.repairs[i];if(!r||!confirm('Mark this repair completed?'))return;r.status='Completed';r.completedAt=new Date().toLocaleString();r.completedBy=prompt('Completed by (name):','')||'Not entered';save();renderEquipment()}
function updateMeter(id){let e=eBy(id),v=prompt('Enter current TOTAL meter hours for '+e.name,e.hours);if(v===null)return;if(!Number.isFinite(+v)||+v<0)return alert('Enter a valid meter reading');e.hours=+v;save();renderEquipment()}
function newRepair(id){let e=eBy(id);$('equipment').innerHTML=`${btn('← Back',`selected=${JSON.stringify(id)};renderEquipment()`,'secondary')}<h2>Repair note • ${esc(e.name)}</h2><div class="card">${input('rissue','Problem / title','')}${input('rhours','Meter hours',e.hours,'number')}<label>What happened and how did you fix it?<textarea id="rnote" placeholder="Tap the microphone on your phone keyboard to dictate your repair... "></textarea></label><label>Repair photo<input id="rphoto" type="file" accept="image/*"></label>${btn('Save repair',`saveRepair(${JSON.stringify(id)})`)}</div>`}
async function saveRepair(id){let note=$('rnote').value.trim(),issue=$('rissue').value.trim();if(!note&&!issue)return alert('Enter repair notes');db.repairs.push({eq:id,issue,note,hours:+$('rhours').value||0,date:new Date().toLocaleString(),photo:await photoFrom('rphoto')||''});save();selected=id;renderEquipment()}
function openPM(id,h){let e=eBy(id),t=pmTemplates[e.type].find(t=>t.h===h);$('equipment').innerHTML=`${btn('← Back',`selected=${JSON.stringify(id)};renderEquipment()`,'secondary')}<h2>${esc(e.name)} • ${h}-hour PM</h2><div class="card"><p class="warn tiny">Shop-provided draft checklist; verify actual manufacturer procedures and intervals.</p>${t.items.map((x,i)=>`<label style="padding:8px 0"><input type="checkbox" class="pmcheck" value="${i}" style="width:auto"> ${esc(x)}</label>`).join('')}${input('pmhours','Meter hours at completion',e.hours,'number')}<label>Service notes<textarea id="pmnotes"></textarea></label>${btn('Save completed service',`savePM(${JSON.stringify(id)},${h})`)}</div>`}
function savePM(id,h){if(!confirm('Record this PM as completed?'))return;let t=pmTemplates[eBy(id).type].find(t=>t.h===h);db.services.push({eq:id,interval:h,hours:+$('pmhours').value||0,date:new Date().toLocaleString(),notes:$('pmnotes').value,checked:[...document.querySelectorAll('.pmcheck:checked')].map(x=>t.items[+x.value])});if(h===300)eBy(id).last300=+$('pmhours').value||0;save();selected=id;renderEquipment()}
function showQR(id){let url=location.protocol.startsWith('http')?location.href.split('#')[0]+'#equipment='+encodeURIComponent(id):'SHOPTRACK:'+id;let q='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url);let html=`${btn('← Back to QR labels','openQRList()','secondary')}<div class="card"><h2>Equipment tag: ${esc(id)}</h2><p class="warn">Experimental QR: requires internet to display. For shared equipment tags, use a stable hosted app address and shared data storage before printing permanent labels.</p><img alt="Equipment QR code" src="${q}" style="width:220px;max-width:100%;background:white;padding:8px"><p class="tiny">Encoded: ${esc(url)}</p>${btn('Print tag','window.print()','secondary')}</div>`;toolScreen(html)}
function renderParts(){if(editing==='part')return showPartForm();$('parts').innerHTML=`<div class="flex"><h2>Parts room</h2>${btn('＋ Add part','editPart()')}</div><input id="partSearch" placeholder="Search part number or name" oninput="listParts(this.value)"><div id="partList"></div><div class="card"><h3>Order request (${db.orders.length})</h3>${db.orders.map(id=>{let p=pBy(id);return p?`<div class="row flex"><span>${esc(p.name)} • ${esc(id)}</span>${btn('Remove',`removeOrder(${JSON.stringify(id)})`,'secondary')}</div>`:''}).join('')||'<p>No parts selected.</p>'}${btn('📋 Copy email-ready list','copyOrder()')}${btn('✉️ Open email draft','emailOrder()','secondary')}</div>`;listParts('')}
function listParts(q){$('partList').innerHTML=db.parts.filter(p=>(p.id+' '+p.name+' '+p.bin).toLowerCase().includes(q.toLowerCase())).map(p=>`<div class="card"><div class="flex"><b>${esc(p.name)}</b><span class="pill ${+p.qty<+p.min?'warn':'good'}">Stock ${p.qty} / min ${p.min}</span></div><small>${esc(p.id)} • Bin ${esc(p.bin)}</small><div class="flex" style="margin-top:10px">${btn('−',`adjustStock(${JSON.stringify(p.id)},-1)`,'secondary')}${btn('＋',`adjustStock(${JSON.stringify(p.id)},1)`,'secondary')}${btn('Order',`addOrder(${JSON.stringify(p.id)})`)}${btn('Edit',`editPart(${JSON.stringify(p.id)})`,'secondary')}</div></div>`).join('')||'<p>No parts found.</p>'}
function editPart(id){editing='part';selected=id||null;renderParts()}
function showPartForm(){let p=pBy(selected)||{};$('parts').innerHTML=`<h2>${selected?'Edit':'Add'} part</h2><div class="card">${input('pid','Part number / barcode',p.id)}${input('pname','Description',p.name)}${input('pqty','Quantity on hand',p.qty||0,'number')}${input('pmin','Minimum stock',p.min||0,'number')}${input('pbin','Shelf / bin',p.bin)}${input('pmodels','Compatible models',p.models)}<label>Notes<textarea id="pnotes">${esc(p.notes)}</textarea></label>${btn('Save part','savePart()')} ${btn('Cancel',"editing=null;selected=null;renderParts()",'secondary')}</div>`}
function savePart(){let id=$('pid').value.trim(),name=$('pname').value.trim();if(!id||!name)return alert('Part number and description required');if(db.parts.some(p=>p.id===id&&p.id!==selected))return alert('Part number exists');let p={id,name,qty:+$('pqty').value||0,min:+$('pmin').value||0,bin:$('pbin').value,models:$('pmodels').value,notes:$('pnotes').value};if(selected){Object.assign(pBy(selected),p);db.orders=db.orders.map(x=>x===selected?id:x)}else db.parts.push(p);save();editing=null;selected=null;renderParts()}
function adjustStock(id,n){pBy(id).qty=Math.max(0,(+pBy(id).qty||0)+n);save();renderParts()};function addOrder(id){if(!db.orders.includes(id))db.orders.push(id);save();if(tab==='parts')renderParts();else renderHome()};function removeOrder(id){db.orders=db.orders.filter(x=>x!==id);save();renderParts()};function orderText(){return 'SHOPTRACK PARTS REQUEST\nDate: '+new Date().toLocaleDateString()+'\n\n'+db.orders.map(id=>{let p=pBy(id);return p?`${p.id} | ${p.name} | On hand: ${p.qty} | Minimum: ${p.min} | Bin: ${p.bin}`:''}).join('\n')+'\n\nPlease confirm order quantities.'};async function copyOrder(){try{await navigator.clipboard.writeText(orderText());alert('Copied. Paste into your email.')}catch(e){prompt('Copy the order list:',orderText())}}function emailOrder(){location.href='mailto:?subject='+encodeURIComponent('ShopTrack parts request')+'&body='+encodeURIComponent(orderText())}
function renderRotations(){let fs=db.equipment.filter(e=>e.type==='Forklift'&&e.status!=='Archived'&&e.status!=='Out of Service');$('rotations').innerHTML=`<h2>Forklift hour balancer</h2><div class="card"><p class="muted tiny">Forklift limit uses the current lifetime meter reading (not hours since the start of the year). Recommendations are only candidates; verify capacity, tires, attachments, service condition, and department requirements.</p>${input('defaultLimit','Default forklift total-meter limit (hours)',db.settings.annualLimit,'number')}${btn('Save allowance',"db.settings.annualLimit=+$('defaultLimit').value||7000;save();renderRotations()",'secondary')}</div>${fs.map(e=>`<div class="card"><div class="flex"><b>${esc(e.name)} • ${area(e)}</b><span>${used(e)} / ${limit(e)} hrs</span></div><progress value="${Math.min(used(e),limit(e))}" max="${limit(e)}"></progress><small>${esc(e.capacity||'Swap compatibility not specified')}</small></div>`).join('')}<div class="card"><h3>Potential rotation</h3><div id="suggest"></div></div><div class="card"><h3>Move history</h3>${db.moves.slice().reverse().map(m=>`<div class="row"><b>${esc(m.eq)}</b>: ${esc(m.from)} → ${esc(m.to)}<br><small>${esc(m.date)} • ${m.hours} hrs</small></div>`).join('')||'<small>No moves logged.</small>'}</div>`;let sorted=fs.slice().sort((a,b)=>used(a)/limit(a)-used(b)/limit(b));let low=sorted[0],high=sorted[sorted.length-1];$('suggest').innerHTML=low&&high&&low.id!==high.id?`<p>Consider reviewing <b>${esc(high.name)} (${used(high)} hrs, ${area(high)})</b> and <b>${esc(low.name)} (${used(low)} hrs, ${area(low)})</b> for a possible swap.</p>${btn('Record a move','moveForm()')}`:'<p>Add at least two forklifts to compare.</p>'}
function moveForm(){$('suggest').innerHTML=`<label>Forklift${select('moveEq',db.equipment.filter(e=>e.type==='Forklift').map(e=>e.id),'')}</label><label>New department${select('moveDept',db.departments,'')}</label>${input('moveHours','Meter reading at move',0,'number')}${btn('Save move','saveMove()')}`}
function saveMove(){let e=eBy($('moveEq').value);if(!e)return;let from=e.department,to=$('moveDept').value;if(from===to)return alert('Choose a different department');let hours=+$('moveHours').value||e.hours;db.moves.push({eq:e.id,from,to,hours,date:new Date().toLocaleString()});e.department=to;e.hours=hours;save();renderRotations()}

 const extras=db.dailyReports['2026-11-16'].extras??=[];
 if(!extras.some(x=>/forklift #?1/i.test(x.activity||'')&&/steer tires/i.test(x.description||'')))extras.push({activity:'Forklift #1',status:'Not complete',description:'Replace both steer tires — new tires still need to be installed. Carry over as unfinished work.'});
 db.settings[flag]=true;save();
})();

// v2.8 additive features: existing records and shift report remain unchanged.
db.orderRequests??=[];
const originalShowMachineV28=showMachine;
showMachine=function(e){originalShowMachineV28(e);const panel=document.createElement('div');panel.className='card';panel.innerHTML=`<h3>🛠️ Quick tools</h3><div class="grid">${btn('🎙️ Voice repair',`openVoiceRepair(${JSON.stringify(e.id)})`)}${btn('🔁 Repeat failures',`openRepeatFor(${JSON.stringify(e.id)})`,'secondary')}${btn('📦 Request part',`openOrderForm(${JSON.stringify(e.id)})`,'secondary')}${btn('▦ QR label',`showQR(${JSON.stringify(e.id)})`,'secondary')}</div>`;const root=$('equipment');root.insertBefore(panel,root.children[2]||null);};
function toolScreen(html){tab='tools';render();$('tools').innerHTML=html;window.scrollTo(0,0)}
function renderTools(){const repeats=findRepeats();$('tools').innerHTML=`<h2>🛠️ Shop tools</h2><div class="card"><h3>Quick actions</h3><div class="grid">${btn('🎙️ Voice repair','openVoiceRepair()')}${btn('🔁 Repeat failures','openRepeatFor()','secondary')}${btn('📦 Parts requests','openOrderForm()','secondary')}${btn('▦ QR labels','openQRList()','secondary')}</div></div><div class="card"><b>${repeats.length} potential repeat-failure group(s)</b><p class="muted tiny">Suggestions based on matching equipment and repair wording. Review before concluding the same failure returned.</p></div>`;}
function eqChoices(chosen=''){return `<option value="">Select equipment</option>`+db.equipment.filter(e=>e.status!=='Archived').map(e=>`<option value="${esc(e.id)}" ${e.id===chosen?'selected':''}>${esc(e.name)} (${esc(e.id)})</option>`).join('')}
function openVoiceRepair(id=''){toolScreen(`<h2>🎙️ Voice repair entry</h2><div class="card"><label>Equipment<select id="voiceEq">${eqChoices(id)}</select></label><label>Issue / work performed<input id="voiceIssue" placeholder="e.g. Repaired grease fittings"></label><label>Dictated notes<textarea id="voiceNote" placeholder="Tap Start dictation, or use your phone keyboard microphone"></textarea></label><div class="flex">${btn('🎙️ Start dictation','startVoice()')}${btn('Stop','stopVoice()','secondary')}</div><p id="voiceStatus" class="muted tiny">Speech recognition depends on browser support and microphone permission. You can always type or use the keyboard microphone.</p><label>Status<select id="voiceStatusChoice"><option>Pending</option><option>In Progress</option><option>Completed</option></select></label><label>Priority<select id="voicePriority"><option value="2">2 — Normal</option><option value="1">1 — Urgent</option><option value="3">3 — Low</option></select></label>${btn('Save repair entry','saveVoiceRepair()')}</div>`)}
let voiceRecognition=null;
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceStatus').textContent='Built-in speech recognition unavailable here. Use the microphone on your phone keyboard.';return}stopVoice();try{voiceRecognition=new SR();voiceRecognition.lang='en-US';voiceRecognition.continuous=true;voiceRecognition.interimResults=false;voiceRecognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)$('voiceNote').value+=($('voiceNote').value?' ':'')+e.results[i][0].transcript};voiceRecognition.onerror=e=>{$('voiceStatus').textContent='Microphone: '+e.error+'. You can type instead.'};voiceRecognition.onend=()=>{if($('voiceStatus'))$('voiceStatus').textContent='Dictation stopped. Review the text before saving.'};voiceRecognition.start();$('voiceStatus').textContent='Listening…';}catch(e){$('voiceStatus').textContent='Could not start dictation: '+e.message}}
function stopVoice(){if(voiceRecognition){try{voiceRecognition.stop()}catch(e){}voiceRecognition=null}}
function saveVoiceRepair(){stopVoice();const eq=$('voiceEq').value,issue=$('voiceIssue').value.trim(),note=$('voiceNote').value.trim(),status=$('voiceStatusChoice').value;if(!eq||(!issue&&!note))return alert('Choose equipment and enter an issue or notes.');const now=new Date();db.repairs.push({eq,issue:issue||note.slice(0,80),note,status,priority:$('voicePriority').value,date:now.toLocaleString(),completedAt:status==='Completed'?now.toISOString():null,hours:null,photo:'',assignedTo:''});save();tab='equipment';selected=eq;editing=null;render();alert('Repair saved to the equipment history.');}
function normalizedIssue(s){const words=String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3&&!['repair','repaired','replace','replaced','inspect','inspection','needs','with','from','work','pending','completed','issue','machine','equipment','install'].includes(w));return [...new Set(words)].slice(0,8)}
function findRepeats(eq=''){const groups=[];const byEq={};db.repairs.forEach((r,i)=>{if(eq&&r.eq!==eq)return;(byEq[r.eq]??=[]).push({...r,_index:i})});for(const [id,rows] of Object.entries(byEq)){const seen=new Set();for(const r of rows){const tokens=normalizedIssue(r.issue||r.note);for(const token of tokens){if(seen.has(token))continue;const matches=rows.filter(x=>normalizedIssue(x.issue||x.note).includes(token));if(matches.length>=2){groups.push({id,token,matches});seen.add(token)}}}}return groups.sort((a,b)=>b.matches.length-a.matches.length)}
function openRepeatFor(id=''){const groups=findRepeats(id);toolScreen(`<h2>🔁 Repeat failure tracker</h2><div class="card"><label>Equipment filter<select id="repeatEq" onchange="openRepeatFor(this.value)"><option value="">All equipment</option>${db.equipment.map(e=>`<option value="${esc(e.id)}" ${id===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><p class="muted tiny">Possible repeats based on shared issue keywords on the same machine. Not a confirmed diagnosis; older entries may be incomplete.</p></div>${groups.map(g=>`<div class="card"><h3>${esc(eBy(g.id)?.name||g.id)} • ${esc(g.token)}</h3><span class="pill">${g.matches.length} matching records</span>${g.matches.map(r=>`<div class="row"><b>${esc(r.issue||'Repair')}</b><br><small>${esc(r.date||'Date unknown')} • ${esc(r.status||'Recorded')}</small><p class="tiny">${esc(r.note||'')}</p></div>`).join('')}${btn('Open equipment',`openDashboardMachine(${JSON.stringify(g.id)})`,'secondary')}</div>`).join('')||'<div class="card"><p>No repeated issue keywords found in the recorded repairs.</p></div>'}`)}
function openOrderForm(eq=''){toolScreen(`<h2>📦 Parts ordering assistant</h2><div class="card"><label>Equipment<select id="orderEq">${eqChoices(eq)}</select></label><label>Part number or description<input id="orderPart" list="orderPartOptions" placeholder="Enter part number or name"></label><datalist id="orderPartOptions">${db.parts.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</datalist><label>Quantity<input id="orderQty" type="number" min="1" step="1" value="1"></label><label>Priority<select id="orderPriority"><option>Normal</option><option>Urgent</option><option>When available</option></select></label><label>Notes<textarea id="orderNotes" placeholder="Reason needed, alternate part number, etc."></textarea></label>${btn('Add to order list','addOrderRequest()')}</div><div class="card"><h3>Order list (${db.orderRequests.length})</h3>${db.orderRequests.map((r,i)=>`<div class="row"><b>${esc(r.part)} × ${r.qty}</b><br><small>${esc(eBy(r.eq)?.name||r.eq||'No machine')} • ${esc(r.priority)}</small><p class="tiny">${esc(r.notes||'')}</p>${btn('Remove',`removeOrderRequest(${i})`,'secondary')}</div>`).join('')||'<p class="muted">No new requests yet.</p>'}<div class="grid">${btn('📋 Copy request','copyOrderRequests()')}${btn('✉️ Email draft','emailOrderRequests()','secondary')}</div><p class="muted tiny">Email opens a draft; ShopTrack does not send messages automatically. Existing Parts room orders remain available separately.</p></div>`)}
function addOrderRequest(){const part=$('orderPart').value.trim(),qty=Number($('orderQty').value);if(!part||!Number.isInteger(qty)||qty<1)return alert('Enter a part and a whole-number quantity.');db.orderRequests.push({eq:$('orderEq').value,part,qty,priority:$('orderPriority').value,notes:$('orderNotes').value.trim(),date:new Date().toISOString()});save();openOrderForm($('orderEq').value)}
function removeOrderRequest(i){db.orderRequests.splice(i,1);save();openOrderForm()}
function orderRequestsText(){return 'SHOPTRACK PARTS REQUEST\nDate: '+new Date().toLocaleDateString()+'\n\n'+db.orderRequests.map(r=>`${r.part} | Qty: ${r.qty} | Equipment: ${eBy(r.eq)?.name||r.eq||'Unassigned'} | Priority: ${r.priority}${r.notes?' | Notes: '+r.notes:''}`).join('\n')+'\n\nPlease confirm availability and ordering.'}
async function copyOrderRequests(){try{await navigator.clipboard.writeText(orderRequestsText());alert('Parts request copied.')}catch(e){prompt('Copy parts request:',orderRequestsText())}}
function emailOrderRequests(){if(!db.orderRequests.length)return alert('Add a part first.');location.href='mailto:?subject='+encodeURIComponent('ShopTrack parts request')+'&body='+encodeURIComponent(orderRequestsText())}
function openQRList(){toolScreen(`<h2>▦ Equipment QR labels</h2><div class="card"><p class="warn tiny">Camera scanning directly into ShopTrack requires a stable hosted HTTPS address. A local HTML file cannot supply a universal phone-camera link. QR images use an online service.</p><label>Search equipment<input id="qrFilter" placeholder="Forklift #47, CAT 63..." oninput="filterQRList(this.value)"></label><div id="qrList"></div></div>`);filterQRList('')}
function filterQRList(q){$('qrList').innerHTML=db.equipment.filter(e=>e.status!=='Archived'&&(e.name+' '+e.id+' '+(e.fleetNo||'')).toLowerCase().includes(q.toLowerCase())).slice(0,100).map(e=>`<div class="row flex"><span>${esc(e.name)} <small>${esc(e.id)}</small></span>${btn('QR label',`showQR(${JSON.stringify(e.id)})`,'secondary')}</div>`).join('')}

window.addEventListener('hashchange',()=>{let m=location.hash.match(/^#equipment=(.*)$/);if(m){let id=decodeURIComponent(m[1]);if(eBy(id)){tab='equipment';selected=id;editing=null;render()}}});render();if(location.hash.startsWith('#equipment='))window.dispatchEvent(new Event('hashchange'));
</script></body></html>
