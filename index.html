.shop-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,20,30,.88),rgba(8,20,30,0) 62%)}
.shop-hero-label{position:absolute;z-index:1;left:16px;bottom:15px;color:#fff;text-shadow:0 2px 6px #000;font-size:clamp(16px,3vw,23px);font-weight:800}
.shop-hero-label small{display:block;color:#f8c76b;font-size:12px;font-weight:600;margin-top:3px}

/* v2.10.2 integrated SVG neon gear: wedge-shaped tool targets */
.st-gear-card{background:radial-gradient(ellipse at 50% 45%,#16314a,#06121e 80%);border:1px solid #4d667a;overflow:hidden;text-align:center;padding:10px 6px 18px}
.st-gear-card h3{font-size:23px;margin:4px 0;text-shadow:0 0 14px #ff9b26}
.st-gear-svg{width:min(100%,560px);height:auto;display:block;margin:0 auto;overflow:visible;filter:drop-shadow(0 0 10px #f69b2455)}
.st-gear-wedge{cursor:pointer;outline:none}
.st-gear-wedge .st-wedge-face{transition:filter .12s,stroke-width .12s}
.st-gear-wedge:hover .st-wedge-face,.st-gear-wedge:focus .st-wedge-face{filter:brightness(1.8);stroke-width:5}.st-gear-wedge:active{opacity:.75}
.st-gear-wedge:focus-visible{outline:none}
.st-gear-text{fill:#f8fcff;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#07121b;stroke-width:2.5px;stroke-linejoin:round;pointer-events:none}
.st-gear-emoji{font-size:30px;text-anchor:middle;pointer-events:none}
@media(max-width:420px){.st-gear-text{font-size:16px}}

/* v2.10.10: uniform equipment list, with right-side controls on all screen sizes */
.shop-eq-card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;min-width:0}
.shop-eq-info{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.shop-eq-copy{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.shop-eq-name{display:block;font-weight:700;line-height:1.35}
.shop-eq-meta{display:block;color:#aabaca;font-size:13px;line-height:1.5;margin-top:4px}
.shop-eq-status{display:table;margin-top:6px;font-size:11px;font-weight:700;color:#ffd079;background:#59432b;border:1px solid #95713c;border-radius:7px;padding:3px 7px;max-width:100%}
.shop-eq-photo{width:62px;height:62px;flex:0 0 62px;object-fit:cover;border-radius:8px}
.shop-eq-actions{display:flex;flex-direction:column;align-items:stretch;gap:7px;flex:0 0 124px;width:124px}
.shop-eq-actions button{width:100%;min-height:42px;padding:8px 6px;font-size:13px;line-height:1.2;white-space:normal}
@media(max-width:420px){.shop-eq-card{gap:8px;padding:10px}.shop-eq-actions{flex-basis:108px;width:108px}.shop-eq-actions button{font-size:12px}.shop-eq-photo{width:48px;height:48px;flex-basis:48px}.shop-eq-meta{font-size:12px}}

async function photoFrom(id){let f=$(id)?.files?.[0];if(!f)return null;return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.62))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(f)})}

function pmState(e,h){const rec=db.services.filter(s=>s.eq===e.id&&s.interval===h).sort((a,b)=>b.hours-a.hours)[0];const baseline=rec?.hours??(h===300?e.last300:null);if(baseline==null||e.hours==null)return {known:false};const elapsed=Number(e.hours)-Number(baseline),remaining=h-elapsed;return {known:true,baseline,elapsed,remaining,pct:Math.max(0,Math.min(100,elapsed/h*100)),status:remaining<=0?'DUE':remaining<=PM_WARNING?'COMING UP':'GOOD',color:remaining<=0?'#d55d55':remaining<=PM_WARNING?'#e6ad42':'#4aaf83'};}

function filterRepairs(){const el=$('repairList');if(!el)return;let q=($('repairSearch')?.value||'').toLowerCase();el.innerHTML=db.repairs.filter(r=>r.eq===window.currentRepairEq&&(r.note+' '+r.issue).toLowerCase().includes(q)).slice().reverse().map(r=>`<div class="row"><b>${esc(r.issue||'Repair')}</b><br><small>${esc(r.date)} • ${r.hours} hrs</small><p>${esc(r.note)}</p><small>Priority ${esc(r.priority||'—')} • Status: ${esc(r.status||'Completed / historical')}</small> ${r.status&&r.status!=='Completed'?btn('Mark completed',`completeRepair(${db.repairs.indexOf(r)})`,'secondary'):''}${r.photo?`<img class="thumb" src="${r.photo}">`:''}${r.eq==='4-012-0047'&&/bent carriage/i.test(r.issue||'')?`<div class="grid">${carriage47Photos.map((src,i)=>`<a href="${src}" target="_blank" title="View carriage photo ${i+1}"><img class="thumb" src="${src}" alt="Forklift 47 carriage damage photo ${i+1}"></a>`).join('')}</div><small>Two inspection photos embedded in this ShopTrack version. They are not automatically attached to email.</small>`:''}</div>`).join('')||'<p class="muted">No matching repairs.</p>'}
function completeRepair(i){let r=db.repairs[i];if(!r||!confirm('Mark this repair completed?'))return;r.status='Completed';r.completedAt=new Date().toLocaleString();r.completedBy=prompt('Completed by (name):','')||'Not entered';save();renderEquipment()}
function updateMeter(id){let e=eBy(id),v=prompt('Enter current TOTAL meter hours for '+e.name,e.hours);if(v===null)return;if(!Number.isFinite(+v)||+v<0)return alert('Enter a valid meter reading');e.hours=+v;save();renderEquipment()}
function newRepair(id){let e=eBy(id);$('equipment').innerHTML=`${btn('← Back',`selected=${JSON.stringify(id)};renderEquipment()`,'secondary')}<h2>Repair note • ${esc(e.name)}</h2><div class="card">${input('rissue','Problem / title','')}${input('rhours','Meter hours',e.hours,'number')}<label>What happened and how did you fix it?<textarea id="rnote" placeholder="Tap the microphone on your phone keyboard to dictate your repair... "></textarea></label><label>Repair photo<input id="rphoto" type="file" accept="image/*"></label>${btn('Save repair',`saveRepair(${JSON.stringify(id)})`)}</div>`}
async function saveRepair(id){let note=$('rnote').value.trim(),issue=$('rissue').value.trim();if(!note&&!issue)return alert('Enter repair notes');db.repairs.push({eq:id,issue,note,hours:+$('rhours').value||0,date:new Date().toLocaleString(),photo:await photoFrom('rphoto')||''});save();selected=id;renderEquipment()}

function buildNeonGear(options){
 const cx=260,cy=260,outer=201,inner=83;
 const colors=['#ff9e28','#46ff72','#00cfff','#ff9e28','#46ff72','#00cfff','#ff9e28','#00cfff'];
 const polar=(r,a)=>{const t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]};
 const pt=(r,a)=>polar(r,a).map(n=>n.toFixed(2)).join(' ');
 const sector=(a,b,r1=inner,r2=outer)=>`M ${pt(r2,a)} A ${r2} ${r2} 0 0 1 ${pt(r2,b)} L ${pt(r1,b)} A ${r1} ${r1} 0 0 0 ${pt(r1,a)} Z`;
 let teeth='';for(let i=0;i<24;i++){const a=i*15-5.8,b=i*15+5.8;teeth+=`<path d="M ${pt(206,a)} L ${pt(237,a+1)} L ${pt(237,b-1)} L ${pt(206,b)} Z" fill="url(#stBrushedSteel)" stroke="#ffac4b" stroke-width="1.7"/>`}
 let wedges=options.map((o,i)=>{
   const a=i*45-22.5+1.1,b=(i+1)*45-22.5-1.1,ang=i*45;
   const [x,y]=polar(145,ang);
   const label=o[1].replace(' ','|').split('|');
   const lines=label.map((t,j)=>`<tspan x="${x.toFixed(1)}" dy="${j===0?0:18}">${t}</tspan>`).join('');
   const color=colors[i];
   const icon=o[1]==='QR labels'?'<rect x="-12" y="-12" width="24" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M-8-8h7v7h-7z M2-8h7v7H2z M-8 2h7v7h-7z M3 3h3v3H3z M8 3v6 M3 9h6" fill="none" stroke="currentColor" stroke-width="2"/>':null;
   return `<g class="st-gear-wedge" role="button" tabindex="0" aria-label="${o[1]}" onclick="${o[2]}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.dispatchEvent(new MouseEvent('click',{bubbles:true}))}">
    <path d="${sector(a,b)}" fill="url(#stPanel)" stroke="#152e43" stroke-width="2"/>
    <path d="${sector(a,b,91,194)}" fill="none" stroke="${color}" stroke-width="2.7" filter="url(#stNeonGlow)"/>
    <path class="st-wedge-face" d="${sector(a,b,91,194)}" fill="none" stroke="${color}" stroke-width="2.5"/>
    <path d="${sector(a+2,b-2,185,188)}" fill="${color}" opacity=".22" pointer-events="none"/>
    ${icon?`<g transform="translate(${x.toFixed(1)} ${(y-23).toFixed(1)})" style="color:${color}" pointer-events="none">${icon}</g>`:`<text class="st-gear-emoji" x="${x.toFixed(1)}" y="${(y-17).toFixed(1)}">${o[0]}</text>`}
    <text class="st-gear-text" x="${x.toFixed(1)}" y="${(y+13-(label.length-1)*9).toFixed(1)}">${lines}</text></g>`;
 }).join('');
 return `<svg class="st-gear-svg" viewBox="0 0 520 520" role="group" aria-label="Eight stationary ShopTrack tool buttons"><defs>
 <linearGradient id="stBrushedSteel" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#e7eef3"/><stop offset=".13" stop-color="#53697b"/><stop offset=".31" stop-color="#b6c5ce"/><stop offset=".48" stop-color="#24374a"/><stop offset=".7" stop-color="#9bacba"/><stop offset=".9" stop-color="#314659"/><stop offset="1" stop-color="#e1e7e9"/></linearGradient>
 <radialGradient id="stPanel" cx=".45" cy=".38" r=".8"><stop stop-color="#1c3449"/><stop offset=".5" stop-color="#0b1e30"/><stop offset="1" stop-color="#030e19"/></radialGradient>
 <radialGradient id="stHub"><stop stop-color="#243e50"/><stop offset=".7" stop-color="#0a1a2a"/><stop offset="1" stop-color="#030c15"/></radialGradient>
 <filter id="stNeonGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.3"/></filter>
 <filter id="stHubGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
 </defs>
 <circle cx="260" cy="260" r="244" fill="#ff8b20" opacity=".09" filter="url(#stHubGlow)"/>
 <circle cx="260" cy="260" r="211" fill="url(#stBrushedSteel)" stroke="#ffb45d" stroke-width="3"/>
 ${teeth}
 <circle cx="260" cy="260" r="207" fill="#061522" stroke="#f8a33d" stroke-width="3"/>
 <circle cx="260" cy="260" r="202" fill="none" stroke="#ff9b27" stroke-width="6" opacity=".55" filter="url(#stNeonGlow)"/>
 ${wedges}
 <circle cx="260" cy="260" r="83" fill="url(#stBrushedSteel)" stroke="#f3c16c" stroke-width="2"/>
 <circle cx="260" cy="260" r="76" fill="none" stroke="#ff9b28" stroke-width="8" filter="url(#stNeonGlow)"/>
 <circle cx="260" cy="260" r="75" fill="url(#stHub)" stroke="#ffb24b" stroke-width="4"/>
 <circle cx="260" cy="260" r="67" fill="none" stroke="#a9c5d8" stroke-width="1" opacity=".45"/>

 <text x="260" y="293" fill="#fff" font-weight="900" font-size="21" text-anchor="middle" letter-spacing=".6">TRACK</text>
 </svg>`;
}

function stSpinWheel(){
 const opts=window.stWheelOptions||[];const rotor=document.getElementById('stWheelRotor');if(!opts.length||!rotor||window.stWheelBusy)return;
 window.stWheelBusy=true;
 const selected=Math.floor(Math.random()*opts.length);
 const previous=window.stWheelRotation||0;
 const current=((previous%360)+360)%360;
 const target=((360-selected*45)%360+360)%360;
 const offset=((target-current+360)%360);
 const next=previous+1080+offset;
 window.stWheelRotation=next;window.stWheelSelected=selected;
 const spinButton=document.getElementById('stSpinButton');if(spinButton)spinButton.disabled=true;
 rotor.style.transform='rotate('+next+'deg)';
 document.querySelectorAll('.st-wheel-option').forEach((b,i)=>b.classList.remove('st-wheel-active'));
 const open=document.getElementById('stWheelOpen');if(open)open.textContent='Spinning…';
 setTimeout(()=>{
  document.querySelectorAll('.st-wheel-option').forEach((b,i)=>b.classList.toggle('st-wheel-active',i===selected));
  if(open)open.textContent='Open: '+opts[selected][1];
  if(spinButton)spinButton.disabled=false;window.stWheelBusy=false;
 },3000);
}

function stApplyImport(){let lines=$('stPaste').value.split('\n').map(x=>x.trim()).filter(Boolean),added=0,skipped=[];for(let line of lines){let a=line.split(/\t|\|/).map(x=>x.trim());if(a.length<3){skipped.push(line);continue}let [wo,num,title,due='']=a;if(!wo||!title||db.shopJobs.some(j=>j.wo===wo)){skipped.push(line);continue}let e=db.equipment.find(e=>[e.fleetNo,e.cfpNo,e.id,e.name].some(v=>v&&String(v).toLowerCase()===num.toLowerCase())||String(e.fleetNo||'')===num.replace(/^#/,'')||e.name.toLowerCase().includes(' #'+num.replace(/^#/,'')));if(!e){skipped.push(line);continue}db.shopJobs.push({id:'job-'+Date.now()+'-'+added,eq:e.id,wo,title,description:'',priority:'Normal',status:'Open',assignee:'',due,createdAt:stNow()});added++}save();alert(`${added} jobs imported. ${skipped.length} lines skipped (duplicates, unknown equipment, or invalid format).${skipped.length?'\n\n'+skipped.slice(0,5).join('\n'):''}`);stWorkScreen()}

function stMeterScreen(eq=''){toolScreen(`<h2>⏱️ Equipment meter readings</h2><div class="card"><p class="muted tiny">Each saved reading keeps its date and previous meter value. These are equipment running hours, not mechanic labor hours.</p><label>Equipment<select id="smEq" onchange="stMeterScreen(this.value)">${stSelectEq(eq)}</select></label>${input('smHours','Current meter reading',eq&&eBy(eq)?.hours!=null?eBy(eq).hours:'','number')}<label>Reading date<input id="smDate" type="date" value="${stDate()}"></label>${btn('Save reading','stSaveMeter()')} ${btn('Fleet report','stFleetScreen()','secondary')} ${btn('Maintenance oversight','stPmScreen()','secondary')}</div><div class="card"><h3>Reading history</h3>${db.meterHistory.filter(x=>!eq||x.eq===eq).slice(-40).reverse().map(x=>`<div class="row">${esc(stEqName(x.eq))} • <b>${x.hours.toLocaleString()} hrs</b><br><small>${esc(stDate(x.date))} • Previous: ${x.previous??'Unknown'} • ${esc(x.source)}</small></div>`).join('')||'<p class="muted">No readings saved yet.</p>'}</div>`)}
function stSaveMeter(){let eq=$('smEq').value,v=$('smHours').value.trim(),date=$('smDate').value;if(!eq||!v||!date||!Number.isFinite(+v)||+v<0)return alert('Choose equipment, date, and a valid meter reading.');let e=eBy(eq);if(e.hours!=null&&+v<+e.hours&&!confirm('This is below the current meter reading. Save anyway?'))return;stRecordMeter(eq,+v,date+'T12:00:00','Weekly walk');save();stMeterScreen(eq)}
function stFleetRows(){return db.equipment.filter(e=>e.status!=='Archived').map(e=>{let h=db.meterHistory.filter(x=>x.eq===e.id&&x.hours!==null&&x.hours!==''&&Number.isFinite(Number(x.hours))&&x.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));let last=h.at(-1),prev=null,days=null,change=null,weekly=null;if(last){for(let i=h.length-2;i>=0;i--){let d=(new Date(String(last.date).slice(0,10)+'T12:00:00')-new Date(String(h[i].date).slice(0,10)+'T12:00:00'))/86400000;if(d>0){prev=h[i];days=d;break}}}if(prev){change=Number(last.hours)-Number(prev.hours);if(change>=0)weekly=change*7/days}return {name:e.name||'Unnamed equipment',id:e.id,hours:e.hours,last:last?stDate(last.date):'',change,weekly,days,dated:!!last,history:h.length};})}
function stWeeklyLabel(r){return r.weekly!==null?r.weekly.toLocaleString(undefined,{maximumFractionDigits:1})+' hrs/week':r.change!==null&&r.change<0?'Meter reset / check':'Need 2 dated readings'}
function stFleetText(){let lines=['SHOPTRACK FLEET HOURS REPORT','Generated: '+new Date().toLocaleString(),'Equipment | Current hours | Latest dated reading | Weekly average | Meter change'];for(let r of stFleetRows())lines.push([r.name,r.hours??'Unknown',r.last||'Not recorded',stWeeklyLabel(r),r.change===null?'Insufficient history':r.change].join(' | '));return lines.join('\n')}
function stFleetCsv(){let rows=[['Equipment','Current hours','Latest dated reading','Hours between dated readings','Reading count','Weekly average hours','Reading interval days']];for(let r of stFleetRows())rows.push([r.name,r.hours??'Unknown',r.last||'Not recorded',r.change===null?'Insufficient history':r.change,r.history,r.weekly??'',r.days??'']);return rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
/* v2.10.2: Independent, read-only MAPCON oversight. User confirms every due target; no inferred last service. */
if(!db.pmOversight||typeof db.pmOversight!=='object')db.pmOversight={};
if(!db.settings.pmHyster10V2102){
 const id='4-010-2000';
 if(!db.equipment.some(e=>e.id===id))db.equipment.push({id,name:'Maintenance Forklift #10',fleetNo:'10',type:'Forklift',make:'Hyster',model:'H80C',serial:'CD5210852',year:'1980',department:'Shop',hours:7968,status:'Active',notes:'Reported running rough; inspection needed. Prior paper write-up not located. Meter 7,968 reported Nov 18, 2026; reading date not independently confirmed.',yearStart:0,annualLimit:0,capacity:'',photo:''});
 db.settings.pmHyster10V2102=true;
 try{localStorage.setItem(KEY,JSON.stringify(db))}catch(err){console.warn(err)}
}
function stPmData(id){return db.pmOversight[id]||{interval:'',due:'',verified:'',note:''}}
function stPmRows(){return db.equipment.filter(e=>e.status!=='Archived').map(e=>{let p=stPmData(e.id),h=Number(e.hours),due=Number(p.due),valid=p.due!==''&&Number.isFinite(due)&&due>=0&&Number.isFinite(h);let left=valid?due-h:null;return {e,p,left,state:!valid?'unconfigured':left<0?'overdue':left<=50?'soon':'ok'}}).sort((a,b)=>({overdue:0,soon:1,ok:2,unconfigured:3}[a.state]-{overdue:0,soon:1,ok:2,unconfigured:3}[b.state])||(a.left??Infinity)-(b.left??Infinity))}
function stPmScreen(){let rows=stPmRows(),over=rows.filter(r=>r.state==='overdue').length,soon=rows.filter(r=>r.state==='soon').length,unknown=rows.filter(r=>r.state==='unconfigured').length;toolScreen(`<h2>🔧 Maintenance Oversight</h2><div class="card"><p class="muted tiny">Personal cross-check only. MAPCON remains the official record. Enter a confirmed next-due meter for each machine; missing ShopTrack verification does not prove maintenance was missed.</p><div class="st-fleet-summary"><div><b>${over}</b><small>Past due target</small></div><div><b>${soon}</b><small>Within 50 hrs</small></div><div><b>${unknown}</b><small>Not configured</small></div></div><label>Find equipment<input id="pmFind" placeholder="Search name or ID" oninput="stPmFilter()"></label><label>Show<select id="pmShow" onchange="stPmFilter()"><option value="all">All equipment</option><option value="attention">Needs attention</option><option value="unconfigured">Not configured</option></select></label><div id="pmList"></div></div>${btn('← Fleet hours','stFleetScreen()','secondary')}`);stPmFilter()}
function stPmFilter(){let el=document.getElementById('pmList');if(!el)return;let q=(document.getElementById('pmFind').value||'').toLowerCase(),filter=document.getElementById('pmShow').value;el.innerHTML=stPmRows().filter(r=>(r.e.name+' '+r.e.id).toLowerCase().includes(q)&&(filter==='all'||filter==='attention'&&['overdue','soon'].includes(r.state)||filter==='unconfigured'&&r.state==='unconfigured')).map(r=>`<div class="row"><div class="flex"><b>${esc(r.e.name)}</b><span class="pill ${r.state==='overdue'?'warn':r.state==='ok'?'good':''}">${r.state==='unconfigured'?'Set due meter':r.state==='overdue'?'Past due target '+Math.abs(r.left).toLocaleString()+' hrs':r.state==='soon'?'Due in '+r.left.toLocaleString()+' hrs':'Due in '+r.left.toLocaleString()+' hrs'}</span></div><small>Meter: ${r.e.hours==null?'Unknown':esc(String(r.e.hours))} hrs · ${esc(r.e.id)}${r.p.due!==''?' · Target: '+esc(String(r.p.due)):''}</small><div style="margin-top:7px">${btn('View / update',`stPmEdit(${JSON.stringify(r.e.id)})`,'secondary')}</div></div>`).join('')||'<p class="muted">No matching equipment.</p>'}
function stPmEdit(id){let e=db.equipment.find(x=>x.id===id);if(!e)return;let p=stPmData(id);toolScreen(`<h2>🔧 ${esc(e.name)}</h2><div class="card"><p class="muted">Current meter: ${e.hours==null?'Unknown':esc(String(e.hours))} hours</p><p class="muted tiny">Use the verified next due meter from MAPCON or the binder. The interval is optional and only used to propose the next target after verification.</p><label>Service interval (hours, optional)<input id="pmInterval" type="number" min="1" step="1" value="${esc(String(p.interval??''))}" placeholder="e.g. 300"></label><label>Next service due at meter hours<input id="pmDue" type="number" min="0" step="1" value="${esc(String(p.due??''))}" placeholder="Confirmed next due"></label><label>Notes / MAPCON reference<textarea id="pmNote">${esc(p.note||'')}</textarea></label>${btn('Save due target','stPmSave('+JSON.stringify(id)+')')} ${btn('← Oversight','stPmScreen()','secondary')}</div><div class="card"><h3>Service verification</h3><p class="muted tiny">Only verify after checking MAPCON. This records your confirmation locally; it does not modify MAPCON.</p><p>Last verified: ${esc(p.verified||'Not yet verified')}</p>${btn('Verified in MAPCON','stPmVerify('+JSON.stringify(id)+')','secondary')}</div>`)}
function stPmSave(id){let iv=document.getElementById('pmInterval').value.trim(),due=document.getElementById('pmDue').value.trim();if((iv!==''&&(!Number.isFinite(+iv)||+iv<=0))||(due!==''&&(!Number.isFinite(+due)||+due<0)))return alert('Enter valid nonnegative due hours and a positive interval.');let old=stPmData(id);db.pmOversight[id]={...old,interval:iv,due,note:document.getElementById('pmNote').value.trim()};save();stPmScreen()}
function stPmVerify(id){let p=stPmData(id);if(p.due==='')return alert('First enter a confirmed service target.');if(!confirm('Have you checked MAPCON and confirmed this service was completed?'))return;let stamp=new Date().toLocaleString(),next={...p,verified:stamp};if(p.interval!==''&&Number(p.interval)>0){let nextDue=Number(p.due)+Number(p.interval);while(nextDue<=Number(db.equipment.find(e=>e.id===id)?.hours??0))nextDue+=Number(p.interval);next.due=String(nextDue)}else next.due='';db.pmOversight[id]=next;save();stPmEdit(id)}

function stFleetScreen(){let rows=stFleetRows(),dated=rows.filter(r=>r.dated).length,comparable=rows.filter(r=>r.change!==null).length;toolScreen(`<h2>📊 Fleet Hours Dashboard</h2><div class="card"><div class="flex">${btn('🔧 Maintenance oversight','stPmScreen()','secondary')} ${btn('🖨 Forklift PM sheets','stForkliftPmScreen()','secondary')}</div><div class="st-fleet-summary"><div><b>${rows.length}</b><small>Active units</small></div><div><b>${dated}</b><small>Dated readings</small></div><div><b>${comparable}</b><small>Usage trends</small></div></div><p class="muted tiny">Usage trends need two dated readings. Weekly averages use the latest two readings on different dates. Negative differences may mean a meter was replaced or reset.</p><div class="st-fleet-controls"><label>Search equipment<input id="stFleetSearch" type="search" placeholder="Forklift number or equipment name" oninput="stFilterFleet()"></label><label>Show<select id="stFleetFilter" onchange="stFilterFleet()"><option value="all">All equipment</option><option value="dated">Has dated reading</option><option value="missing">No dated reading</option><option value="trend">Has usage trend</option></select></label></div><div class="flex">${btn('📋 Copy full report','stCopyFleet()')} ${btn('⬇ Download text','stDownloadFleet()','secondary')} ${btn('⬇ Download CSV','stDownloadFleetCsv()','secondary')}</div><p class="muted tiny">Exports include all active equipment, regardless of search or filter.</p><p id="stFleetCount" class="muted tiny" aria-live="polite"></p><div id="stFleetRows" class="st-fleet-list"></div></div>`);stFilterFleet()}
function stFilterFleet(){let container=document.getElementById('stFleetRows');if(!container)return;let q=(document.getElementById('stFleetSearch')?.value||'').trim().toLowerCase(),filter=document.getElementById('stFleetFilter')?.value||'all';let rows=stFleetRows().filter(r=>(r.name.toLowerCase().includes(q)||String(r.id).toLowerCase().includes(q))&&(filter==='all'||filter==='dated'&&r.dated||filter==='missing'&&!r.dated||filter==='trend'&&r.change!==null));document.getElementById('stFleetCount').textContent='Showing '+rows.length+' of '+stFleetRows().length+' active units';container.innerHTML=rows.map(r=>`<div class="st-fleet-row"><div class="st-fleet-line"><strong>${esc(r.name)}</strong><strong>${r.hours==null?'Unknown':esc(Number(r.hours).toLocaleString())+' hrs'}</strong></div><div class="st-fleet-line"><small>${r.last?'Last dated: '+esc(r.last):'No dated reading'}${r.days?' · '+r.days+' days between readings':''}</small><span class="st-fleet-tag ${r.dated?'has-date':'missing-date'}">${esc(stWeeklyLabel(r))}</span></div></div>`).join('')||'<p class="muted">No equipment matches this search or filter.</p>'}
function stCopyFleet(){let t=stFleetText();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('Copied full fleet report')).catch(()=>prompt('Copy report:',t));else prompt('Copy report:',t)}
function stFleetDownload(content,filename,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function stDownloadFleet(){stFleetDownload(stFleetText(),'ShopTrack_Fleet_Hours_'+stDate()+'.txt','text/plain;charset=utf-8')}
function stDownloadFleetCsv(){stFleetDownload('\ufeff'+stFleetCsv(),'ShopTrack_Fleet_Hours_'+stDate()+'.csv','text/csv;charset=utf-8')}
function stReportRows(){let rows=_stReportRows();for(let r of db.shopSubmissions.filter(x=>x.review==='Approved'&&x.status!=='Completed'&&stDate(x.date)===reportDay)){rows.push({activity:stEqName(r.eq),status:r.status,description:r.notes+(r.parts?' | Parts: '+r.parts:''),when:r.date})}return rows}

renderHome=stRenderHome;renderTools=stRenderTools;showMachine=stShowMachine;reportRows=stReportRows;

// v2.9.7: Support the permanent HTTPS equipment QR labels (?equipment=55).
// Resolve the actual internal equipment ID from the forklift number, if necessary.
function stOpenEquipmentFromLink(){
 let code=new URLSearchParams(location.search).get('equipment');
 if(!code && location.hash.startsWith('#equipment='))code=decodeURIComponent(location.hash.slice(11));
 if(!code)return;
 const norm=v=>String(v??'').trim().replace(/^#/, '').toLowerCase();
 const target=db.equipment.find(e=>[e.id,e.cfpNo,e.fleetNo].some(v=>v!=null && norm(v)===norm(code)))
;
 if(target){tab='equipment';selected=target.id;editing=null;render();}
 else {tab='equipment';selected=null;editing=null;render();
   const el=document.getElementById('equipment');if(el)el.insertAdjacentHTML('afterbegin','<div class="card warn">QR requested equipment #'+esc(code)+' but this browser has no matching equipment record. Import your ShopTrack backup or add the machine here.</div>');}
}
stOpenEquipmentFromLink();

// v2.10.3 — printable maintenance parts orders. Stored inside db for JSON backup/restore.
if(!Array.isArray(db.partsOrders))db.partsOrders=[];
const firstOrderParts=[['93820-04400','Fitting assembly, straight',2],['93820-04300','Fitting assembly, 70°',2],['9177110600','Gear pump assembly',1],['F315004000','O-ring',2],['F315002400','O-ring',2],['W505010794','Radiator cap',2]];
let orderEditId=null, orderReturn='parts';
function orderUnitLabel(e){return e?.fleetNo||e?.cfpNo||e?.name||e?.id||''}
function orderCard(){return `<div class="card"><div class="flex"><h3>🧾 Maintenance Parts Orders</h3>${btn('＋ New parts order',"openPartsOrder()")}</div><p class="muted tiny">Save, print, or use your phone's Print → Save as PDF to share in Teams. Orders are included in JSON backups.</p>${db.partsOrders.map(o=>`<div class="row flex"><div><b>${esc(o.equipmentLabel||o.equipmentId||'Equipment')}</b> • ${esc(o.date||'')}<br><small>${esc(o.priority||'')} • ${o.items.length} part lines</small></div><div>${btn('Open',`openPartsOrder(${JSON.stringify(o.id)})`,'secondary')} ${btn('Print',`printPartsOrder(${JSON.stringify(o.id)})`,'secondary')}</div></div>`).join('')||'<p class="muted">No saved orders yet.</p>'}</div>`}
const previousPartsRender=renderParts;
renderParts=function(){previousPartsRender();if(editing==='part')return;const el=$('parts');if(el)el.insertAdjacentHTML('afterbegin',orderCard())};
const previousMachineRender=showMachine;
showMachine=function(e){previousMachineRender(e);const el=$('equipment');if(el){const heading=el.querySelector('h2');if(heading)heading.insertAdjacentHTML('afterend',`<div class="card"><b>🧾 Parts orders for this machine</b><p>${btn('＋ Create parts order',`openPartsOrder(null,${JSON.stringify(e.id)})`)}</p>${db.partsOrders.filter(o=>o.equipmentId===e.id).map(o=>`<div class="row">${esc(o.date)} • ${esc(o.priority)} ${btn('Open',`openPartsOrder(${JSON.stringify(o.id)})`,'secondary')}</div>`).join('')}</div>`)}};
function orderLine(i,p={}){return `<div class="card order-line" style="background:#102333"><div class="flex"><b>Part ${i+1}</b>${btn('Remove',`this.closest('.order-line').remove()`,'secondary')}</div><label>Part number<input class="ol-number" value="${esc(p.number||'')}"></label><label>Description<input class="ol-description" value="${esc(p.description||'')}"></label><label>Quantity<input class="ol-quantity" type="number" min="1" step="1" value="${p.qty||1}"></label></div>`}
function appendOrderLine(p){const el=$('orderLines');if(el)el.insertAdjacentHTML('beforeend',orderLine(el.children.length,p))}
function openPartsOrder(id=null,equipmentId=null){const o=db.partsOrders.find(x=>x.id===id);orderEditId=o?.id||null;orderReturn=tab==='equipment'?'equipment':'parts';const eq=equipmentId||o?.equipmentId||'4-012-0001';const initial=!o&&eq==='4-012-0001'&& !db.partsOrders.some(x=>x.equipmentId===eq);const items=o?.items||(initial?firstOrderParts.map(([number,description,qty])=>({number,description,qty})):[]);
const html=`<h2>${o?'Edit':'New'} Maintenance Parts Order</h2><div class="card"><p class="muted tiny">For parts ordering only. No reference numbers or order-status fields.</p><label>Equipment<select id="poEquipment">${db.equipment.map(e=>`<option value="${esc(e.id)}" ${e.id===eq?'selected':''}>${esc(orderUnitLabel(e))} — ${esc(e.name)}</option>`).join('')}</select></label><label>Date<input type="date" id="poDate" value="${esc(o?.date||new Date().toLocaleDateString('en-CA'))}"></label><label>Requested by<input id="poName" value="${esc(o?.requestedBy||'Michael S.')}"></label><label>Priority<select id="poPriority">${['Emergency','Priority 1','Priority 2','Routine'].map(x=>`<option ${x===(o?.priority||(initial?'Emergency':'Routine'))?'selected':''}>${x}</option>`).join('')}</select></label><label>Description / Reason<textarea id="poReason">${esc(o?.reason||(initial?'Found an oil/coolant leak during inspection. Multiple forklifts are down.':''))}</textarea></label><h3>Parts Needed</h3><div id="orderLines">${items.map((p,i)=>orderLine(i,p)).join('')}</div>${btn('＋ Add part',`appendOrderLine()`,'secondary')}<hr>${btn('💾 Save order',`savePartsOrder()`)} ${btn('🖨️ Print / PDF',`saveAndPrintOrder()`,'secondary')} ${btn('← Back',`returnFromPartsOrder()`,'secondary')}${o?`<p>${btn('Delete saved order',`deletePartsOrder(${JSON.stringify(o.id)})`,'danger')}</p>`:''}</div>`;
editing='partsOrder';$(tab).innerHTML=html;window.scrollTo(0,0)}
function collectPartsOrder(){const equipmentId=$('poEquipment').value,e=db.equipment.find(x=>x.id===equipmentId);const items=[...document.querySelectorAll('.order-line')].map(n=>({number:n.querySelector('.ol-number').value.trim(),description:n.querySelector('.ol-description').value.trim(),qty:Number(n.querySelector('.ol-quantity').value)}));if(!items.length||items.some(x=>!x.number||!x.description||!Number.isInteger(x.qty)||x.qty<1)){alert('Enter a part number, description, and whole-number quantity for each part.');return null}return {id:orderEditId||'PO-'+Date.now(),equipmentId,equipmentLabel:orderUnitLabel(e),date:$('poDate').value,requestedBy:$('poName').value.trim(),priority:$('poPriority').value,reason:$('poReason').value.trim(),items}}
function savePartsOrder(){const o=collectPartsOrder();if(!o)return null;const i=db.partsOrders.findIndex(x=>x.id===o.id);if(i<0)db.partsOrders.push(o);else db.partsOrders[i]=o;orderEditId=o.id;save();alert('Parts order saved to ShopTrack.');return o.id}
function saveAndPrintOrder(){const id=savePartsOrder();if(id)printPartsOrder(id)}
function returnFromPartsOrder(){editing=null;if(orderReturn==='equipment'){const id=$('poEquipment')?.value;selected=id;tab='equipment';renderEquipment()}else{tab='parts';renderParts()}}
function deletePartsOrder(id){if(!confirm('Delete this saved parts order?'))return;db.partsOrders=db.partsOrders.filter(x=>x.id!==id);save();editing=null;if(orderReturn==='equipment')renderEquipment();else renderParts()}

function stForkliftPmData(id){return db.forkliftPmSheets[id]||(db.forkliftPmSheets[id]={300:null,1000:null,4000:null,updated:'',review:true})}
function stForkliftUnits(){return db.equipment.filter(e=>e.type==='Forklift'&&e.status!=='Archived').slice().sort((a,b)=>(Number(a.fleetNo)||999)-(Number(b.fleetNo)||999))}

 toolScreen(`<h2>🖨 Forklift PM binder sheets</h2><div class="card"><p class="muted tiny">Offline working copy. Handwritten targets are provisional. The old 2,000-hour schedule has been replaced by a 4,000-hour interval; historical 2,000-hour targets are NOT automatically treated as new 4,000-hour targets. Confirm with MAPCON before scheduling.</p><div class="flex">${btn('🖨 Print all forklift sheets','stForkliftPmPrint()')}${btn('← Fleet dashboard','stFleetScreen()','secondary')}</div></div>${list.map(e=>{let p=stForkliftPmData(e.id);return `<div class="card"><h3>${esc(e.name)} • Unit ${esc(e.fleetNo||'—')}</h3><small>${esc(e.id)} • Current meter: ${e.hours==null?'Unknown':esc(e.hours)} • ${esc(e.status||'')}</small><div class="grid">${[300,1000,4000].map(h=>`<label>${h.toLocaleString()}-hour PM due at<input type="number" min="0" id="stpm_${h}_${e.id.replace(/[^a-z0-9]/gi,'_')}" value="${p[h]??''}" placeholder="Not confirmed"></label>`).join('')}</div>${p.legacyMajor!=null?`<p class="muted tiny">Historical major-PM target on paper: ${p.legacyMajor}. Requires confirmation for new 4,000-hour schedule.</p>`:''}<div class="flex">${btn('Save readings',`stForkliftPmSave(${JSON.stringify(e.id)})`)}${btn('🖨 Print sheet',`stForkliftPmPrint(${JSON.stringify(e.id)})`,'secondary')}</div></div>`}).join('')}`);
}
function stForkliftPmSave(id){const p=stForkliftPmData(id);for(const h of [300,1000,4000]){let el=document.getElementById('stpm_'+h+'_'+id.replace(/[^a-z0-9]/gi,'_'));if(!el)continue;const v=el.value.trim();if(v!==''&&(!Number.isFinite(+v)||+v<0))return alert('Enter valid meter readings');p[h]=v===''?null:+v;}p.updated=new Date().toLocaleString();p.review=false;save();stForkliftPmScreen(id)}

l);w.document.close();w.focus();setTimeout(()=>w.print(),350)}
